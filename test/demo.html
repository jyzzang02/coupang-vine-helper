<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>상품 목록 샘플 (실제 쿠팡 아님)</title><style>body{font-family:'Malgun Gothic',Arial,sans-serif;margin:32px;background:#f4f6fa;color:#1d2b42}.wrap{max-width:820px;margin:auto}h1{font-size:25px}.notice{color:#678}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:20px}.product-card{background:white;padding:20px;border-radius:12px;border:1px solid #ddd}.product-name{font-size:18px;font-weight:bold}.product-price{margin-top:16px;color:#c30;font-weight:bold}button{padding:9px;background:#2563eb;color:#fff;border:0;border-radius:7px}</style></head><body>
<div class="wrap"><h1>상품 목록 테스트 화면</h1><div class="notice">이 화면은 테스트를 위한 가상의 상품 목록이며 쿠팡과 관계없습니다.</div><button id="add">상품 추가(실시간 갱신 시험)</button><div id="items" class="items">
 <div class="product-card"><a href="https://www.coupang.com/vp/products/70001"><div class="product-name">삼성 노트북 15인치</div></a><div class="product-price">890,000원</div><span>신청 가능</span></div>
 <div class="product-card"><a href="https://www.coupang.com/vp/products/70002"><div class="product-name">고급 냉장고 4도어</div></a><div class="product-price">1,400,000원</div></div>
 <div class="product-card"><a href="https://www.coupang.com/vp/products/70003"><div class="product-name">스마트폰 강화유리 필름</div></a><div class="product-price">16,000원</div></div>
 <div class="product-card"><a href="https://www.coupang.com/vp/products/70004"><div class="product-name">LG 울트라와이드 모니터</div></a><div class="product-price">420,000원</div></div>
 <div class="product-card"><a href="https://www.coupang.com/vp/products/70005"><div class="product-name">애플 태블릿 11인치</div></a><div class="product-price">990,000원</div><span>신청 마감</span></div>
 </div></div><script>document.getElementById('add').onclick = () => {const el = document.createElement('div');el.className='product-card';el.innerHTML='<a href="https://www.coupang.com/vp/products/70006"><div class="product-name">LG 노트북 그램 17인치</div></a><div class="product-price">1,790,000원</div>';document.getElementById('items').appendChild(el);};</script></body></html>
